# Perfil de test: H2 en memoria (sin Docker/Postgres). Hibernate crea el schema.
spring:
  datasource:
    url: jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

accounts:
  service-name: accounts-service-test
  max-page-size: 100

credit-score:
  base-url: http://localhost:0
  connect-timeout-ms: 500
  read-timeout-ms: 500

logging:
  level:
    root: WARN
    co.com.pragma: INFO
